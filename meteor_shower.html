<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Meteor Shower</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #05070f;
    height: 100%;
    width: 100%;
    cursor: default;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(200, 210, 235, 0.5);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
    transition: opacity 1.2s ease;
    text-align: center;
  }
  #hint span {
    display: block;
    font-size: 10px;
    opacity: 0.6;
    margin-top: 4px;
    letter-spacing: 0.05em;
  }
  .ctrlBtn {
    position: fixed;
    right: max(18px, env(safe-area-inset-right));
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(200,210,235,0.25);
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(6px);
    color: rgba(220,228,245,0.85);
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.25s ease, transform 0.15s ease, box-shadow 0.3s ease;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    z-index: 10;
  }
  .ctrlBtn:hover { background: rgba(255,255,255,0.09); }
  .ctrlBtn:active { transform: scale(0.92); }
  #soundToggle { top: max(18px, env(safe-area-inset-top)); }
  #musicToggle { top: calc(max(18px, env(safe-area-inset-top)) + 54px); }
  #musicToggle.on { box-shadow: 0 0 14px rgba(140,170,255,0.55); border-color: rgba(160,190,255,0.5); }
  @media (max-width: 480px) {
    .ctrlBtn { width: 40px; height: 40px; font-size: 15px; }
    #musicToggle { top: calc(max(18px, env(safe-area-inset-top)) + 48px); }
    #hint { font-size: 10.5px; bottom: max(14px, env(safe-area-inset-bottom)); padding: 0 20px; }
    #hint span { font-size: 9px; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="soundToggle" class="ctrlBtn" title="Toggle sound effects">🔈</div>
<div id="musicToggle" class="ctrlBtn" title="Play background music">🎵</div>
<div id="hint">click / tap for a shooting star<span>🔈 sound effects · 🎵 background music</span></div>

<div id="yt-player-wrap" style="position:fixed; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none; top:0; left:0;">
  <div id="yt-player"></div>
</div>
<script>
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
let W, H, DPR;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  // visualViewport keeps sizing correct on mobile when the browser
  // address bar shows/hides or the on-screen keyboard opens.
  const vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
  const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  W = vw;
  H = vh;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function fullResize() {
  resize();
  if (typeof placeMoon === 'function') placeMoon();
  if (typeof makeStars === 'function') makeStars();
}
window.addEventListener('resize', fullResize);
window.addEventListener('orientationchange', () => setTimeout(fullResize, 200));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fullResize);
}
resize();

/* =========================================================
   SOUND ENGINE — fully procedural (Web Audio API).
   No external audio files: a soft cosmic wind/drone bed plays
   continuously, plus a whoosh per meteor and a deeper boom for
   click-triggered fireballs. Panned left/right by screen x.
   ========================================================= */
const Sound = (() => {
  let ctxA = null, master = null, droneGain = null, started = false, enabled = true;

  function init() {
    if (ctxA) return;
    ctxA = new (window.AudioContext || window.webkitAudioContext)();
    master = ctxA.createGain();
    master.gain.value = 0.55;
    master.connect(ctxA.destination);
    buildDrone();
    buildWind();
  }

  function buildDrone() {
    droneGain = ctxA.createGain();
    droneGain.gain.value = 0.0;
    droneGain.connect(master);

    const filter = ctxA.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 420;
    filter.Q.value = 0.7;
    filter.connect(droneGain);

    [55, 55.6, 110.3].forEach((freq, i) => {
      const osc = ctxA.createOscillator();
      osc.type = i === 2 ? 'triangle' : 'sine';
      osc.frequency.value = freq;
      const g = ctxA.createGain();
      g.gain.value = i === 2 ? 0.12 : 0.22;
      osc.connect(g);
      g.connect(filter);
      osc.start();
    });

    const lfo = ctxA.createOscillator();
    lfo.frequency.value = 0.04;
    const lfoGain = ctxA.createGain();
    lfoGain.gain.value = 160;
    lfo.connect(lfoGain);
    lfoGain.connect(filter.frequency);
    lfo.start();

    droneGain.gain.linearRampToValueAtTime(0.35, ctxA.currentTime + 3);
  }

  function buildWind() {
    const bufferSize = ctxA.sampleRate * 4;
    const buffer = ctxA.createBuffer(1, bufferSize, ctxA.sampleRate);
    const data = buffer.getChannelData(0);
    let last = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      data[i] = last * 3.5;
    }
    const src = ctxA.createBufferSource();
    src.buffer = buffer;
    src.loop = true;
    const filter = ctxA.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 600;
    filter.Q.value = 0.5;
    const g = ctxA.createGain();
    g.gain.value = 0.05;
    src.connect(filter);
    filter.connect(g);
    g.connect(master);
    src.start();
  }

  function whoosh(px, big) {
    if (!enabled || !ctxA) return;
    const dur = big ? 1.1 : 0.55;
    const bufferSize = Math.floor(ctxA.sampleRate * dur);
    const buffer = ctxA.createBuffer(1, bufferSize, ctxA.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const src = ctxA.createBufferSource();
    src.buffer = buffer;

    const filter = ctxA.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = big ? 1.4 : 1.1;
    const startFreq = big ? 2600 : 1800;
    const endFreq = big ? 300 : 500;
    filter.frequency.setValueAtTime(startFreq, ctxA.currentTime);
    filter.frequency.exponentialRampToValueAtTime(endFreq, ctxA.currentTime + dur);

    const g = ctxA.createGain();
    g.gain.setValueAtTime(0, ctxA.currentTime);
    g.gain.linearRampToValueAtTime(big ? 0.5 : 0.28, ctxA.currentTime + dur * 0.15);
    g.gain.exponentialRampToValueAtTime(0.001, ctxA.currentTime + dur);

    const panner = ctxA.createStereoPanner ? ctxA.createStereoPanner() : null;
    src.connect(filter);
    filter.connect(g);
    if (panner) {
      panner.pan.value = Math.max(-1, Math.min(1, (px / W) * 2 - 1));
      g.connect(panner);
      panner.connect(master);
    } else {
      g.connect(master);
    }

    src.start();
    src.stop(ctxA.currentTime + dur + 0.05);

    if (big) boom();
  }

  function boom() {
    const osc = ctxA.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(120, ctxA.currentTime);
    osc.frequency.exponentialRampToValueAtTime(35, ctxA.currentTime + 0.5);
    const g = ctxA.createGain();
    g.gain.setValueAtTime(0.35, ctxA.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctxA.currentTime + 0.6);
    osc.connect(g);
    g.connect(master);
    osc.start();
    osc.stop(ctxA.currentTime + 0.65);
  }

  function toggle() {
    if (!ctxA) { init(); started = true; }
    enabled = !enabled;
    if (ctxA.state === 'suspended') ctxA.resume();
    master.gain.linearRampToValueAtTime(enabled ? 0.55 : 0, ctxA.currentTime + 0.4);
    return enabled;
  }

  function ensureStarted() {
    if (!started) { init(); started = true; }
    if (ctxA && ctxA.state === 'suspended') ctxA.resume();
  }

  return { whoosh, toggle, ensureStarted, get enabled() { return enabled; } };
})();

const soundToggle = document.getElementById('soundToggle');
soundToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  const on = Sound.toggle();
  soundToggle.textContent = on ? '🔈' : '🔇';
});

/* =========================================================
   BACKGROUND MUSIC — embeds the YouTube video's own player
   (via the official IFrame Player API) so the track plays
   through YouTube itself, looped, hidden off-screen. Starts
   only on the button tap (required for audio on mobile).
   ========================================================= */
const YT_VIDEO_ID = '8_u4OG5U5IM';
const musicToggle = document.getElementById('musicToggle');
let ytPlayer = null;
let ytReady = false;
let musicOn = false;
let musicPending = false;

const ytApiTag = document.createElement('script');
ytApiTag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(ytApiTag);

window.onYouTubeIframeAPIReady = function () {
  ytPlayer = new YT.Player('yt-player', {
    videoId: YT_VIDEO_ID,
    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      fs: 0,
      modestbranding: 1,
      loop: 1,
      playlist: YT_VIDEO_ID, // required by YouTube for single-video looping
      playsinline: 1
    },
    events: {
      onReady: () => {
        ytReady = true;
        if (musicPending) startMusic();
      },
      onStateChange: (e) => {
        // Safety net loop in case playlist-loop doesn't trigger on a device
        if (e.data === YT.PlayerState.ENDED) {
          ytPlayer.seekTo(0);
          ytPlayer.playVideo();
        }
      }
    }
  });
};

function startMusic() {
  if (!ytReady) { musicPending = true; return; }
  musicPending = false;
  ytPlayer.unMute();
  ytPlayer.setVolume(45);
  ytPlayer.playVideo();
  musicOn = true;
  musicToggle.textContent = '🎶';
  musicToggle.classList.add('on');
}

function stopMusic() {
  musicOn = false;
  musicPending = false;
  musicToggle.textContent = '🎵';
  musicToggle.classList.remove('on');
  if (ytPlayer && ytReady) ytPlayer.pauseVideo();
}

musicToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  if (musicOn) stopMusic();
  else startMusic();
});

const hint = document.getElementById('hint');
function isControlTarget(e) {
  return !!(e.target && e.target.closest && e.target.closest('.ctrlBtn'));
}
window.addEventListener('pointerdown', (e) => {
  if (isControlTarget(e)) return;
  Sound.ensureStarted();
  if (hint.style.opacity !== '0') hint.style.opacity = '0';
});
setTimeout(() => { hint.style.opacity = '0'; }, 6000);

// ---------- Background gradient (night sky) ----------
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#02030a');
  g.addColorStop(0.55, '#060a1a');
  g.addColorStop(1, '#0c1226');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// ---------- Moon ----------
const moon = { x: 0, y: 0, r: 0 };
function placeMoon() {
  moon.x = W * 0.82;
  moon.y = H * 0.18;
  moon.r = Math.min(W, H) * 0.045;
}
placeMoon();

function drawMoon() {
  const glow = ctx.createRadialGradient(moon.x, moon.y, 0, moon.x, moon.y, moon.r * 6);
  glow.addColorStop(0, 'rgba(210,220,255,0.18)');
  glow.addColorStop(1, 'rgba(210,220,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(moon.x, moon.y, moon.r * 6, 0, Math.PI * 2);
  ctx.fill();

  const body = ctx.createRadialGradient(
    moon.x - moon.r * 0.3, moon.y - moon.r * 0.3, moon.r * 0.1,
    moon.x, moon.y, moon.r
  );
  body.addColorStop(0, '#fdfbf5');
  body.addColorStop(1, '#c9cfe0');
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.beginPath();
  ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = 'rgba(160,168,190,0.35)';
  [[-0.3, -0.2, 0.22], [0.25, 0.15, 0.16], [0.05, 0.4, 0.12]].forEach(([dx, dy, r]) => {
    ctx.beginPath();
    ctx.arc(moon.x + dx * moon.r, moon.y + dy * moon.r, r * moon.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

// ---------- Stars (two depth layers for parallax feel) ----------
const STAR_COUNT = 260;
let stars = [];
function makeStars() {
  stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    const deep = Math.random() < 0.6;
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: (deep ? Math.random() * 0.9 + 0.15 : Math.random() * 1.5 + 0.5),
      baseAlpha: deep ? Math.random() * 0.35 + 0.15 : Math.random() * 0.6 + 0.35,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinklePhase: Math.random() * Math.PI * 2
    });
  }
}
makeStars();

function drawStars(t) {
  for (const s of stars) {
    const flicker = Math.sin(t * s.twinkleSpeed + s.twinklePhase) * 0.35;
    const alpha = Math.max(0, Math.min(1, s.baseAlpha + flicker));
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- Distant glow / nebula haze ----------
function drawHaze() {
  const g1 = ctx.createRadialGradient(W*0.75, H*0.15, 0, W*0.75, H*0.15, W*0.55);
  g1.addColorStop(0, 'rgba(80,60,140,0.10)');
  g1.addColorStop(1, 'rgba(80,60,140,0)');
  ctx.fillStyle = g1;
  ctx.fillRect(0, 0, W, H);

  const g2 = ctx.createRadialGradient(W*0.15, H*0.6, 0, W*0.15, H*0.6, W*0.5);
  g2.addColorStop(0, 'rgba(40,80,140,0.08)');
  g2.addColorStop(1, 'rgba(40,80,140,0)');
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, W, H);
}

// ---------- Vignette ----------
function drawVignette() {
  const g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// ---------- Meteors ----------
class Meteor {
  constructor(forcedBurst) {
    this.reset(forcedBurst);
  }
  reset(forcedBurst) {
    const angle = (Math.random() * 18 + 55) * Math.PI / 180;
    this.angle = angle;
    this.speed = Math.random() * 9 + 11;
    this.len = Math.random() * 140 + 90;
    this.x = Math.random() * (W * 1.3) - W * 0.15;
    this.y = -Math.random() * H * 0.4 - 20;
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;
    this.life = 1;
    this.maxLife = Math.random() * 40 + 55;
    this.age = 0;
    this.thickness = Math.random() * 1.4 + 1.1;
    this.hue = Math.random() < 0.75 ? 0 : (Math.random() < 0.5 ? 1 : 2);
    this.flare = forcedBurst || Math.random() < 0.12;
    if (this.flare) {
      this.thickness *= 2.2;
      this.len *= 1.4;
    }
    this.trail = [];
    Sound.whoosh(this.x, this.flare);
  }
  colorStops() {
    if (this.hue === 0) return ['255,255,255', '190,210,255', '120,150,255'];
    if (this.hue === 1) return ['255,244,214', '255,210,140', '255,160,80'];
    return ['220,255,230', '160,255,190', '90,220,160'];
  }
  update() {
    this.age++;
    this.x += this.vx;
    this.y += this.vy;
    this.trail.push({x: this.x, y: this.y});
    if (this.trail.length > 6) this.trail.shift();
    if (this.age > this.maxLife || this.x > W + 100 || this.y > H + 100) {
      this.dead = true;
    }
  }
  draw() {
    const tailX = this.x - this.vx * (this.len / this.speed);
    const tailY = this.y - this.vy * (this.len / this.speed);
    const [c1, c2, c3] = this.colorStops();

    let progress = this.age / this.maxLife;
    let fade = 1;
    if (progress < 0.12) fade = progress / 0.12;
    else if (progress > 0.75) fade = 1 - (progress - 0.75) / 0.25;

    const grad = ctx.createLinearGradient(tailX, tailY, this.x, this.y);
    grad.addColorStop(0, `rgba(${c3},0)`);
    grad.addColorStop(0.4, `rgba(${c2},${0.35 * fade})`);
    grad.addColorStop(1, `rgba(${c1},${0.95 * fade})`);

    ctx.save();
    ctx.lineCap = 'round';

    ctx.strokeStyle = grad;
    ctx.lineWidth = this.thickness * 3.2;
    ctx.globalAlpha = 0.28 * fade;
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();

    ctx.globalAlpha = 1;
    ctx.strokeStyle = grad;
    ctx.lineWidth = this.thickness;
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();

    const headGlow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.thickness * 5);
    headGlow.addColorStop(0, `rgba(${c1},${0.9 * fade})`);
    headGlow.addColorStop(1, `rgba(${c1},0)`);
    ctx.fillStyle = headGlow;
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.thickness * 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

let meteors = [];
let lastSpawn = 0;
let spawnInterval = 900;

function maybeSpawn(t) {
  if (t - lastSpawn > spawnInterval) {
    meteors.push(new Meteor(false));
    lastSpawn = t;
    spawnInterval = Math.random() * 1400 + 500;
  }
}

window.addEventListener('pointerdown', (e) => {
  if (isControlTarget(e)) return;
  meteors.push(new Meteor(true));
});

// ---------- Animation loop ----------
function frame(t) {
  drawSky();
  drawHaze();
  drawMoon();
  drawStars(t * 0.06);

  maybeSpawn(t);

  ctx.globalCompositeOperation = 'lighter';
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.update();
    m.draw();
    if (m.dead) meteors.splice(i, 1);
  }
  ctx.globalCompositeOperation = 'source-over';

  drawVignette();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
